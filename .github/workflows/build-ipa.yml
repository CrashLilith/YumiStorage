name: Build YumiStorage IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macOS 26 includes Xcode 26 and the iOS 26 SDK used by Liquid Glass.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          cache: true

      - name: Restore libidevice FFI library
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/pwnapplehat/EscapeOS/releases/download/v0.1.5/libidevice_ffi.a \
            --output YumiStorage/Tunnel/libidevice_ffi.a
          echo "6524066d54ef23e00d46445c04dfc694e180196d54119d718f68434fa225be35  YumiStorage/Tunnel/libidevice_ffi.a" | shasum -a 256 -c -
          test "$(stat -f '%z' YumiStorage/Tunnel/libidevice_ffi.a)" -gt 1000000

      - name: Build IPA
        run: |
          set -euo pipefail
          make clean
          make package TARGET=iphone:clang:latest:18.0

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YumiStorage-ipa
          path: packages/*.ipa
          if-no-files-found: error
